<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <path d="M 50 4 L 88 20 L 82 66 L 50 96 L 18 66 L 12 20 Z" fill="#030712" stroke="url(#cyanGlow)" stroke-width="2.5" />
  
  <!-- Outer Tactical Shield Accent -->
  <path d="M 50 10 L 82 24 L 77 62 L 50 88 L 23 62 L 18 24 Z" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Red Emergency Beacon Arc Arcs -->
  <path d="M 32 30 A 24 24 0 0 1 68 30" fill="none" stroke="url(#redGlow)" stroke-width="3" stroke-linecap="round" filter="url(#neon)" />
  <path d="M 28 66 A 26 26 0 0 0 72 66" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-linecap="round" />

  <!-- Hexagonal AI Targeting Lens -->
  <polygon points="50,26 70,37 70,61 50,72 30,61 30,37" fill="#0b1329" stroke="url(#cyanGlow)" stroke-width="2.5" />

  <!-- Inner Radar / Optical Circle -->
  <circle cx="50" cy="49" r="16" fill="#030712" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="50" cy="49" r="11" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 2" />

  <!-- Medical Cross / Emergency Core -->
  <path d="M 47 41 H 53 V 46 H 58 V 52 H 53 V 57 H 47 V 52 H 42 V 46 H 47 Z" fill="#ef4444" />
  <circle cx="50" cy="49" r="2" fill="#ffffff" />

  <!-- Targeting Reticle Crosshairs -->
  <line x1="50" y1="33" x2="50" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="58" x2="50" y2="65" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="34" y1="49" x2="41" y2="49" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="59" y1="49" x2="66" y2="49" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
</svg>
